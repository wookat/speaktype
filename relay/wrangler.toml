name = "speaktype-relay"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# 官方部署同时挂在 speaktype.zalize.com/relay 下（workers.dev 在部分地区不可达）；
# 自部署用户删掉这段即可，只用 workers.dev 地址。
workers_dev = true
routes = [
  { pattern = "speaktype.zalize.com/relay*", zone_name = "zalize.com" },
]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
