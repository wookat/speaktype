appId: com.speaktype.desktop
productName: SpeakType
# uiohook-napi / koffi 均自带 N-API 预编译产物，无需 node-gyp 重编
npmRebuild: false
directories:
  buildResources: build
  output: release
files:
  - out/**
  - build/icon.png
  - "!node_modules/**/{test,tests,docs,example,examples}/**"
  # koffi 自带全平台预编译产物 + 源码/文档，只保留目标平台（见 win/mac 块）
  - "!node_modules/koffi/{doc,src,vendor}/**"
  - "!node_modules/koffi/build/koffi/*/**"
# 内置离线识别：whisper.cpp server 及其 CPU 后端 DLL（模型由应用内下载，不入包）
extraResources:
  - from: resources/whisper
    to: whisper
asarUnpack:
  - "**/*.node"
  - node_modules/koffi/**
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  files:
    - node_modules/koffi/build/koffi/win32_x64/**
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: build/icon.png
  category: public.app-category.productivity
  files:
    - node_modules/koffi/build/koffi/darwin_arm64/**
    - node_modules/koffi/build/koffi/darwin_x64/**
  extendInfo:
    NSMicrophoneUsageDescription: SpeakType uses the microphone for voice typing.
dmg:
  artifactName: SpeakType-${version}-${arch}.dmg
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SpeakType
  artifactName: SpeakType-Setup-${version}.exe
electronDownload:
  cache: .electron-cache
