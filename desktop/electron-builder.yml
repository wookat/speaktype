appId: com.speaktype.desktop
productName: SpeakType
directories:
  buildResources: build
  output: release
files:
  - out/**
  - "!node_modules/**/{test,tests,docs,example,examples}/**"
asarUnpack:
  - "**/*.node"
  - node_modules/koffi/**
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SpeakType 语音输入法
  artifactName: SpeakType-Setup-${version}.exe
electronDownload:
  cache: .electron-cache
