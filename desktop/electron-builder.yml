appId: com.speaktype.desktop
productName: SpeakType
# uiohook-napi / koffi 均自带 N-API 预编译产物，无需 node-gyp 重编
npmRebuild: false
directories:
  buildResources: build
  output: release
files:
  - out/**
  - build/icon.png
  - "!node_modules/**/{test,tests,docs,example,examples}/**"
  # koffi 自带全平台预编译产物 + 源码/文档，只保留 win x64
  - "!node_modules/koffi/{doc,src,vendor}/**"
  - "!node_modules/koffi/build/koffi/*/**"
  - node_modules/koffi/build/koffi/win32_x64/**
asarUnpack:
  - "**/*.node"
  - node_modules/koffi/**
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SpeakType 语音输入法
  artifactName: SpeakType-Setup-${version}.exe
electronDownload:
  cache: .electron-cache
