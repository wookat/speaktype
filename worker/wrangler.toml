name = "speaktype-relay"
main = "src/index.ts"
# 不要超过本地 wrangler 自带 workerd 支持的日期，否则 `wrangler dev` 起不来
compatibility_date = "2026-05-01"

# 凭证用 secret 存放，不要写进本文件：
#   wrangler secret put VOLC_APP_KEY
#   wrangler secret put VOLC_ACCESS_KEY
#   wrangler secret put ZHIPU_API_KEY
[vars]
VOLC_RESOURCE_ID = "volc.bigasr.sauc.duration"
ALLOWED_ORIGINS = ""
